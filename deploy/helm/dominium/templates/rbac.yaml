# Read-only access to ConfigMaps in the inventory namespace. RBAC cannot be
# limited to a label, so the app can read every ConfigMap there: prefer a
# dedicated namespace for the inventory.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dominium.fullname" . }}
  namespace: {{ include "dominium.inventoryNamespace" . }}
  labels:
    {{- include "dominium.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dominium.fullname" . }}
  namespace: {{ include "dominium.inventoryNamespace" . }}
  labels:
    {{- include "dominium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dominium.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dominium.fullname" . }}
    namespace: {{ .Release.Namespace }}
