# promtool unit tests for the chart's alert rules; run with `make alerts-test`,
# which renders the rules to target/alerts.yaml first.
rule_files:
  - ../../target/alerts.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      # 20 days left: a warning, unless auto-renew is on.
      - series: 'dominium_domain_expiry_timestamp_seconds{domain="off.com",registrar="porkbun"}'
        values: '1728000x30'
      - series: 'dominium_domain_auto_renew{domain="off.com",registrar="porkbun"}'
        values: '0x30'
      - series: 'dominium_domain_expiry_timestamp_seconds{domain="on.com",registrar="cloudflare"}'
        values: '1728000x30'
      - series: 'dominium_domain_auto_renew{domain="on.com",registrar="cloudflare"}'
        values: '1x30'
      - series: 'dominium_domain_expiry_timestamp_seconds{domain="unknown.com",registrar="namecheap"}'
        values: '1728000x30'
      # 3 days left with auto-renew on: critical anyway.
      - series: 'dominium_domain_expiry_timestamp_seconds{domain="stuck.dev",registrar="cloudflare"}'
        values: '259200x30'
      - series: 'dominium_domain_auto_renew{domain="stuck.dev",registrar="cloudflare"}'
        values: '1x30'
      - series: 'dominium_domain_expiry_timestamp_seconds{domain="gone.org",registrar="porkbun"}'
        values: '0x30'
      - series: 'dominium_domain_warn_before_seconds{domain="off.com",registrar="porkbun"}'
        values: '2592000x30'
      - series: 'dominium_domain_warn_before_seconds{domain="on.com",registrar="cloudflare"}'
        values: '2592000x30'
      - series: 'dominium_domain_warn_before_seconds{domain="unknown.com",registrar="namecheap"}'
        values: '2592000x30'
      - series: 'dominium_domain_warn_before_seconds{domain="stuck.dev",registrar="cloudflare"}'
        values: '2592000x30'
      - series: 'dominium_domain_warn_before_seconds{domain="gone.org",registrar="porkbun"}'
        values: '2592000x30'
      - series: 'dominium_domain_critical_before_seconds{domain="off.com",registrar="porkbun"}'
        values: '604800x30'
      - series: 'dominium_domain_critical_before_seconds{domain="on.com",registrar="cloudflare"}'
        values: '604800x30'
      - series: 'dominium_domain_critical_before_seconds{domain="unknown.com",registrar="namecheap"}'
        values: '604800x30'
      - series: 'dominium_domain_critical_before_seconds{domain="stuck.dev",registrar="cloudflare"}'
        values: '604800x30'
      - series: 'dominium_domain_critical_before_seconds{domain="gone.org",registrar="porkbun"}'
        values: '604800x30'
      - series: 'dominium_domain_registrar_mismatch{domain="moved.io",registrar="namecheap",rdap_registrar="Cloudflare, Inc."}'
        values: '1x90'
      - series: 'up{job="dominium"}'
        values: '1x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: DomainExpiringSoon
        exp_alerts:
          - exp_labels: {severity: warning, domain: off.com, registrar: porkbun}
            exp_annotations:
              summary: "Domain off.com expires in 19d 23h 55m 0s"
              description: "Auto-renew is off or unknown. Renew it at porkbun."
              runbook_url: "https://domains.example.com/domains/off.com"
          - exp_labels: {severity: warning, domain: unknown.com, registrar: namecheap}
            exp_annotations:
              summary: "Domain unknown.com expires in 19d 23h 55m 0s"
              description: "Auto-renew is off or unknown. Renew it at namecheap."
              runbook_url: "https://domains.example.com/domains/unknown.com"
      - eval_time: 5m
        alertname: DomainExpiringVerySoon
        exp_alerts:
          - exp_labels: {severity: critical, domain: stuck.dev, registrar: cloudflare}
            exp_annotations:
              summary: "Domain stuck.dev expires in 2d 23h 55m 0s"
              description: "If auto-renew is on, the renewal has not happened: check the payment method at the registrar."
              runbook_url: "https://domains.example.com/domains/stuck.dev"
      - eval_time: 5m
        alertname: DomainExpired
        exp_alerts:
          - exp_labels: {severity: critical, domain: gone.org, registrar: porkbun}
            exp_annotations:
              summary: "Domain gone.org has expired"
              description: "Most registries allow renewal during a grace period; after that the domain can be lost."
              runbook_url: "https://domains.example.com/domains/gone.org"
      - eval_time: 30m
        alertname: DomainRegistrarMismatch
        exp_alerts: []
      - eval_time: 61m
        alertname: DomainRegistrarMismatch
        exp_alerts:
          - exp_labels: {severity: warning, domain: moved.io, registrar: namecheap, rdap_registrar: "Cloudflare, Inc."}
            exp_annotations:
              summary: "Domain moved.io is at Cloudflare, Inc., not namecheap"
              description: "If a transfer finished, update the inventory in Pulumi."
      - eval_time: 20m
        alertname: DominiumDown
        exp_alerts: []
