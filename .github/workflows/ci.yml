name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-screenshots:
        description: Render new screenshot baselines (download them from the run's artifact)
        type: boolean
        default: false
      commit-screenshots:
        description: With update-screenshots, also commit the new baselines to the selected branch
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
    env:
      # The screenshot tests are ignored here; the visual job runs them.
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

  visual:
    # Pinned so fonts and rendering only change when the baselines do.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # only used to commit baselines (commit-screenshots)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Install Chromium for the pinned Playwright driver
        run: cargo run --locked --example install-browsers -- chromium --with-deps
      - name: Screenshot tests
        if: ${{ !inputs.update-screenshots }}
        run: make visual
      - name: Render new baselines
        if: ${{ inputs.update-screenshots }}
        run: make visual-update
      - name: Commit new baselines
        if: ${{ inputs.update-screenshots && inputs.commit-screenshots }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/screenshots/*.png
          if git diff --cached --quiet; then
            echo "Baselines unchanged"
          else
            git commit -m "Re-render screenshot baselines on CI"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint
      - name: Alert rules and their unit tests
        run: |
          curl -sSfL https://github.com/prometheus/prometheus/releases/download/v3.6.0/prometheus-3.6.0.linux-amd64.tar.gz \
            | tar xz -C /tmp
          make alerts-test PROMTOOL=/tmp/prometheus-3.6.0.linux-amd64/promtool

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSS is up to date
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          make css
          git diff --exit-code assets/dist/app.css

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
