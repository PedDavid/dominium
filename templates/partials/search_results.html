{% if !rows.is_empty() %}
<div role="group" aria-labelledby="command-domains">
  <span role="heading" id="command-domains">{% if q.is_empty() %}Expiring next{% else %}Domains{% endif %}</span>
  {% for row in rows %}
  <a role="menuitem" href="/domains/{{ row.name }}"{% if loop.first %} class="active"{% endif %}>
    <span class="state-dot" data-state="{{ row.state_str() }}"></span>
    <span class="truncate">{{ row.name }}</span>
    <span class="ms-auto" data-shortcut>{{ row.state_label() }} · {{ row.expires_rel }}</span>
  </a>
  {% endfor %}
</div>
{% endif %}
